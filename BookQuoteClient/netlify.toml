[build]
  base = "BookQuoteClient"                       
  publish = "dist/book-quote-client/browser"      
  command = "npm ci && npx ng build --configuration production"

[build.environment]
  NODE_VERSION = "20"                          
  NPM_FLAGS = "--legacy-peer-deps"  

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200             

[dev]
  command = "ng serve"
  port = 4200
