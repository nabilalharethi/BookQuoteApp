[build]
  base = "BookQuoteClient"                       
  publish = "dist/book-quote-client/browser"      
  command = "npm ci && npm run build -- --configuration production"

[build.environment]
  NODE_VERSION = "20"                          
  NPM_FLAGS = "--legacy-peer-deps"               

[dev]
  command = "ng serve"
  port = 4200
