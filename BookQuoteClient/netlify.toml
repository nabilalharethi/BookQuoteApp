[build]
  base = "BookQuoteClient"                       
  publish = "dist/book-quote-client/browser"      
  command = "npm install && npm run build -- --configuration production"

[build.environment]
  NODE_VERSION = "20"                          
  NPM_FLAGS = "--legacy-peer-deps"  

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 

[[redirects]]
  from = "/api/*"
  to = "https://bookquoteapp-wkrl.onrender.com/api/:splat"
  status = 200            

[dev]
  command = "ng serve"
  port = 4200
